<!DOCTYPE html>
<html lang="en">
<head>
  <title> GreenIT Analysis Panel</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div style="text-align:center; margin-inline: 0.75em;">
    <div class="container-fluid">
      <div class="buttonList">
        <button type="button" id="launchAnalyse" class="btn btn-primary" data-i18n="launchAnalyseButton"></button>
        <button type="button" id="clearBrowserCache" class="btn btn-primary" data-i18n="clearBrowserCacheButton"></button>
        <button type="button" id="saveAnalyse" class="btn btn-primary" data-i18n="saveAnalyseButton"></button>
        <button type="button" id="viewHistory" class="btn btn-primary" data-i18n="historyButton"></button>
        <a href="https://github.com/cnumr/GreenIT-Analysis" target="_blank" class="btn btn-primary" data-i18n="helpButton"></a>
      </div>

      <div data-i18n="activateBestPracticeAnalysisCheckbox">
        <input type="checkbox"  id="analyseBestPracticesCheckBox" />
      </div>
    </div>
 
    <div id="ecoIndexView" hidden>
      <h4> EcoIndex <span id="grade"></span></h4>

      <table class="mytable">
        <tbody>
          <tr>
            <th data-i18n="ecoIndex" class="center-td"></th>
            <th data-i18n="waterConsumption" class="center-td"></th>
            <th data-i18n="greenhouseGasesEmission" class="center-td"> </th>
          </tr>
          <tr>
            <td id="ecoIndex" class="center-td"></td>
            <td id="waterConsumption" class="center-td"></td>
            <td id="greenhouseGasesEmission" class="center-td" ></td>
          </tr>
        </tbody>
      </table>
      <div class="line">.</div>

      <table>
        <tbody>
          <tr>
            <th data-i18n="requestNumber" class="center-td"> </th>
            <th data-i18n="pageSize" class="center-td"> </th>
            <th data-i18n="domSize" class="center-td"> </th>
          </tr>
          <tr>
            <td id="requestNumber" class="center-td"></td>
            <td id="responsesSize" class="center-td"></td>
            <td id="domSize" class="center-td"></td>
          </tr>
        </tbody>
      </table>
      <div class="line"> </div>
    </div>

    <div id="bestPracticesView" hidden>
      <h4 data-i18n="bestPractices"></h4>

      <table class="table table-striped table-hover bestPraticesTable">
        <tbody id="bestPracticesTable">
        </tbody>
      </table>
    </div>
  </div>
  <script type="module" src="main.js"></script>
  <script type="module" src="~/assets/i18n.js"></script>
</body>
</html>
